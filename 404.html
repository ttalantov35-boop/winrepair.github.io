<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — WinRepair Toolkit</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;
      background:#16306A;color:#E4EBFB;font-family:Inter,system-ui,'Segoe UI',sans-serif;text-align:center;position:relative}
    body::before,body::after{content:'';position:fixed;width:46vw;height:46vw;min-width:360px;min-height:360px;border-radius:50%;filter:blur(90px);opacity:.3;z-index:-1}
    body::before{background:#2F7BEA;left:-10%;top:-20%}
    body::after{background:#0FA68A;right:-12%;bottom:-25%;opacity:.4}
    .stripe{position:fixed;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#2F7BEA 0 25%,#0FA68A 25% 50%,#F2641A 50% 75%,#22B04E 75%)}
    main{max-width:560px}
    .face{font-size:6rem;line-height:1;margin:0 0 20px;font-weight:300;color:#fff}
    h1{margin:0 0 12px;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.2;
      background:linear-gradient(180deg,#fff 30%,#A9BFFF);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{margin:0 0 28px;line-height:1.6}
    a{display:inline-flex;gap:8px;align-items:center;padding:12px 18px;border-radius:10px;font-weight:600;color:#fff;text-decoration:none;
      background:linear-gradient(180deg,#3B82F6,#1E5EEB);box-shadow:0 10px 30px -8px rgba(47,123,234,.85)}
    a:focus-visible{outline:3px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <main>
    <p class="face">:(</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка.<br>Page not found — the link may be outdated or mistyped.</p>
    <a href="./">На главную / Home</a>
  </main>
</body>
</html>
